<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1C1917" />
  <title>Offline — RecDex</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1C1917;
      color: #E7E5E4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 420px;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      opacity: 0.7;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #FAFAF9;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #A8A29E;
      margin-bottom: 1.5rem;
    }
    .retry-btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #F97316;
      color: #1C1917;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #FB923C;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#127860;</div>
    <h1>You're offline</h1>
    <p>
      No internet connection right now. Recipes you've visited before
      are still available &mdash; try navigating back.
    </p>
    <a href="/" class="retry-btn" onclick="window.location.reload(); return false;">
      Try again
    </a>
  </div>
</body>
</html>
