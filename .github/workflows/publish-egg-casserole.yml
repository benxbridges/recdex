name: Publish Scrambled Egg Casserole

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-egg-casserole.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish recipe to Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          EXISTS=$(curl -s \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            'https://zacwsrcdvpglrcvirlng.supabase.co/rest/v1/recipes?slug=eq.scrambled-egg-casserole&select=slug' \
          )
          if echo "$EXISTS" | grep -q 'scrambled-egg-casserole'; then
            echo "Recipe already exists, skipping"
            exit 0
          fi

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            'https://zacwsrcdvpglrcvirlng.supabase.co/rest/v1/recipes' \
            -d '{
              "slug": "scrambled-egg-casserole",
              "title": "Scrambled Egg Casserole",
              "description": "A make-ahead brunch showstopper — soft-scrambled eggs layered with sautéed mushrooms, ham, and a from-scratch cheese sauce, topped with buttery breadcrumbs and baked until golden. Assemble the night before, bake in the morning.",
              "cuisine": "American",
              "difficulty": "easy",
              "time_total": 60,
              "time_active": 45,
              "servings": 10,
              "servings_label": "servings",
              "source_attribution": "Adapted from Southern Living, 1980",
              "status": "published",
              "source": "community",
              "tags": ["brunch", "casserole", "eggs", "make-ahead", "cheese", "breakfast", "ham", "mushrooms"],
              "ingredients": [
                {"name": "cubed ham or Canadian bacon", "amount": "1", "unit": "cup", "group": "Casserole"},
                {"name": "chopped green onion", "amount": "1/4", "unit": "cup", "group": "Casserole"},
                {"name": "butter", "amount": "3", "unit": "tbsp", "group": "Casserole"},
                {"name": "eggs, beaten well", "amount": "12", "unit": "", "group": "Casserole"},
                {"name": "fresh mushrooms, sliced", "amount": "8", "unit": "oz", "group": "Casserole"},
                {"name": "melted butter", "amount": "1/4", "unit": "cup", "group": "Topping"},
                {"name": "fresh breadcrumbs", "amount": "2 1/4", "unit": "cups", "group": "Topping"},
                {"name": "paprika", "amount": "", "unit": "", "group": "Topping"},
                {"name": "butter", "amount": "2", "unit": "tbsp", "group": "Cheese Sauce"},
                {"name": "flour", "amount": "2 1/2", "unit": "tbsp", "group": "Cheese Sauce"},
                {"name": "milk", "amount": "2", "unit": "cups", "group": "Cheese Sauce"},
                {"name": "salt", "amount": "1/2", "unit": "tsp", "group": "Cheese Sauce"},
                {"name": "pepper", "amount": "1", "unit": "dash", "group": "Cheese Sauce"},
                {"name": "shredded sharp cheddar cheese", "amount": "1", "unit": "cup", "group": "Cheese Sauce"}
              ],
              "steps": [
                {"step": 1, "text": "Make the cheese sauce: melt 2 tablespoons butter in a saucepan over medium heat. Blend in flour and cook the roux for about 2 minutes, stirring constantly. Gradually add milk, whisking until smooth. Cook over medium heat until thickened, stirring constantly. Season with salt and pepper, then add the shredded cheddar and stir until melted and smooth. Set aside with plastic wrap pressed directly on the surface to prevent a skin from forming."},
                {"step": 2, "text": "Sauté the mushrooms in 1 tablespoon butter over medium-high heat until the liquid is released and evaporated, about 3 minutes. Transfer to a plate and set aside.", "timer_minutes": 3},
                {"step": 3, "text": "Add the remaining 2 tablespoons butter to the skillet. Sauté the ham and green onions until the onions are tender, about 2 minutes."},
                {"step": 4, "text": "Add the beaten eggs to the skillet and cook over medium-high heat, stirring gently to form large, soft curds. When the eggs are just set, fold in the sautéed mushrooms and cheese sauce until evenly combined."},
                {"step": 5, "text": "Spoon the egg mixture into a greased 13x9x2-inch baking pan, spreading evenly."},
                {"step": 6, "text": "Combine the melted butter and breadcrumbs, mixing well. Spread the breadcrumb mixture evenly over the eggs. Sprinkle with paprika."},
                {"step": 7, "text": "Cover the casserole tightly and refrigerate overnight."},
                {"step": 8, "text": "When ready to bake, preheat the oven to 350°F. Uncover the casserole and bake for 30 minutes, or until heated through and the top is golden.", "timer_minutes": 30}
              ]
            }'
          )

          echo "HTTP status: $HTTP_CODE"
          cat /tmp/response.txt
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo ""
            echo "✓ Published: Scrambled Egg Casserole"
            echo "  → /recipe/scrambled-egg-casserole"
            echo "  → /recipe/scrambled-egg-casserole/cook"
          else
            echo ""
            echo "✗ Failed to publish"
            exit 1
          fi
