name: Publish Lemon Cake Recipe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-lemon-cake.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish recipe to Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Check if already exists
          EXISTS=$(curl -s \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            'https://zacwsrcdvpglrcvirlng.supabase.co/rest/v1/recipes?slug=eq.lemon-layer-cake-with-cream-cheese-frosting&select=slug' \
          )
          if echo "$EXISTS" | grep -q 'lemon-layer-cake'; then
            echo "Recipe already exists, skipping"
            exit 0
          fi

          # Insert recipe
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            'https://zacwsrcdvpglrcvirlng.supabase.co/rest/v1/recipes' \
            -d '{
              "slug": "lemon-layer-cake-with-cream-cheese-frosting",
              "title": "Lemon Layer Cake with Cream Cheese Frosting",
              "description": "A towering three-layer lemon cake soaked with lemon syrup and covered in tangy cream cheese frosting. The reverse-creaming method keeps it impossibly tender.",
              "cuisine": "American",
              "difficulty": "easy",
              "time_total": 120,
              "time_active": 45,
              "servings": 12,
              "servings_label": "slices",
              "source_attribution": "Adapted from NYT Cooking",
              "status": "published",
              "source": "community",
              "tags": ["lemon", "cake", "cream cheese frosting", "layer cake", "baking", "birthday", "dessert"],
              "ingredients": [
                {"name": "Unsalted butter, softened", "amount": "¾", "unit": "cup", "group": "Cake and Lemon Syrup"},
                {"name": "All-purpose flour", "amount": "3", "unit": "cups", "group": "Cake and Lemon Syrup"},
                {"name": "Granulated sugar", "amount": "2", "unit": "cups", "group": "Cake and Lemon Syrup"},
                {"name": "Medium lemons", "amount": "3", "unit": "", "group": "Cake and Lemon Syrup"},
                {"name": "Whole milk", "amount": "1½", "unit": "cups", "group": "Cake and Lemon Syrup"},
                {"name": "Baking powder", "amount": "2", "unit": "tsp", "group": "Cake and Lemon Syrup"},
                {"name": "Baking soda", "amount": "½", "unit": "tsp", "group": "Cake and Lemon Syrup"},
                {"name": "Kosher salt", "amount": "1½", "unit": "tsp", "group": "Cake and Lemon Syrup"},
                {"name": "Neutral oil", "amount": "¼", "unit": "cup", "group": "Cake and Lemon Syrup"},
                {"name": "Large eggs, at room temperature", "amount": "4", "unit": "", "group": "Cake and Lemon Syrup"},
                {"name": "Lemon extract (optional)", "amount": "1", "unit": "tbsp", "group": "Cake and Lemon Syrup"},
                {"name": "Powdered sugar, sifted", "amount": "2", "unit": "cups", "group": "Frosting"},
                {"name": "Unsalted butter, softened but cool", "amount": "1", "unit": "cup", "group": "Frosting"},
                {"name": "Cream cheese, softened but cool", "amount": "16", "unit": "oz", "group": "Frosting"},
                {"name": "Lemon zest", "amount": "1", "unit": "lemon", "group": "Frosting"},
                {"name": "Fresh lemon juice", "amount": "1", "unit": "tbsp", "group": "Frosting"}
              ],
              "steps": [
                {"step": 1, "text": "Preheat the oven to 325°F. Butter three 8-inch round cake pans, line each with parchment, butter the parchment, and dust with flour, tapping out the excess."},
                {"step": 2, "text": "Add 1¾ cups of the granulated sugar to the bowl of a stand mixer fitted with the paddle. Zest all 3 lemons directly into the sugar. Use your fingers to rub the zest into the sugar until it looks moist and sandy — this is what releases all those lemon oils."},
                {"step": 3, "text": "Juice the zested lemons into a small bowl. Transfer ¼ cup of juice to a large measuring cup and stir in the milk. Let it sit while you prepare the rest of the cake, reserving the remaining juice for the lemon syrup. The lemon juice will thicken and curdle the milk — that is exactly what you want."},
                {"step": 4, "text": "To the bowl with the lemon sugar, add the flour, baking powder, baking soda, and salt. Mix on low to combine. Add the softened butter all at once and mix on low until evenly distributed and the mixture looks sandy. A few larger lumps of butter are fine."},
                {"step": 5, "text": "Add the oil, eggs, and lemon extract (if using) to the measuring cup with the milk mixture and stir with a fork to combine. With the mixer on low, slowly stream in the milk mixture. When the batter is moistened, stop the mixer and scrape the bottom and sides of the bowl to catch any dry pockets. Mix on medium for 1 minute more."},
                {"step": 6, "text": "Divide the batter evenly among the prepared pans — about 2 heaping cups per pan. Spread evenly and tap the pans on the counter to release any large air bubbles."},
                {"step": 7, "text": "Bake until the cakes are slightly risen and a toothpick inserted in the center comes out clean, 20 to 25 minutes. The edges will have a bit of color but the tops will still be quite pale.", "timer_minutes": 22},
                {"step": 8, "text": "Set the pans on a wire rack and let the cakes cool for about 15 minutes. Run a thin knife along the edges and carefully turn the cakes out onto the rack to cool completely. You may need to tap the pans gently to release them.", "timer_minutes": 15},
                {"step": 9, "text": "While the cakes cool, make the syrup: measure ¼ cup lemon juice from the remaining reserved juice. Combine the juice and the remaining ¼ cup sugar in a small saucepan and bring to a boil over medium-high, stirring occasionally. Cook until the sugar has dissolved, then pour into a heat-safe container to cool."},
                {"step": 10, "text": "Make the frosting: add the powdered sugar and butter to the stand mixer fitted with the paddle and mix on medium until well combined. Add the cream cheese and mix until just combined and fluffy — do not overmix or it will thin out. Stream in a bit of the remaining lemon juice if needed to make a fluffy, spreadable frosting."},
                {"step": 11, "text": "Assemble the cake: place one layer top side up on a serving plate. Brush with lemon syrup, then spread about ¾ cup frosting over the top. Place the second layer top side down, press gently, brush with syrup, and spread another ¾ cup frosting. Brush the top of the final layer with syrup and place it top side down. Cover the top and sides with a thin crumb coat of frosting, leaving about 1½ cups in the bowl. Refrigerate until the frosting is firm, about 20 minutes.", "timer_minutes": 20},
                {"step": 12, "text": "Spread the remaining frosting over the top and sides of the cake. Decorate with lemon slices if desired. Use a clean, hot, dry knife for the tidiest slices. The cake keeps at room temperature, loosely covered, for up to 4 days."}
              ]
            }'
          )

          echo "HTTP status: $HTTP_CODE"
          cat /tmp/response.txt
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "\n✓ Published: Lemon Layer Cake with Cream Cheese Frosting"
          else
            echo "\n✗ Failed to publish"
            exit 1
          fi
